        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body style="background: linear-gradient(to bottom,lightblue,white);">
    <header class="container p-0 rounded-5 fw-semibold shadow-sm" style="background-color: white;" >
        <nav class="navbar navbar-expand-sm rounded-3 mt-2">
            <div class="container">
                <img src="/04-06-2026/cvr.webp" class="navbar-brand" style="width: 40px;" alt="Logo">
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navibar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navibar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="home.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="about.html">About</a>
                        </li>
                        <li class="nav-item dropdown">
                            <button type="button" class="nav-link active dropdown-toggle" data-bs-toggle="dropdown">Courses</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">CSE</a></li>
                                <li><a class="dropdown-item" href="#">ECE</a></li>
                                <li><a class="dropdown-item" href="#">EEE</a></li>
                                <li><a class="dropdown-item" href="#">AIML</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contact.html">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="login.html">Login</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    

    <div class="container d-flex justify-content-around align-items-center fw-normal"  style="background:linear-gradient(to bottom,lightblue,white);">
        <form style="width: 500px; background-color: white;" class="shadow-lg p-4 rounded-4  my-5">
            <p class="h4 mb-4 text-center">Registration Form</p>

            <label for="fullname" class="form-label">Full Name:</label>
            <input type="text" class="form-control mb-3" id="fullname" required style="border-color: rgb(148, 148, 161);">

            <label for="rollno" class="form-label">Roll No:</label>
            <input type="text" class="form-control mb-3" style="border-color: rgb(148, 148, 161);" id="rollno" required>

            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" aria-describedby="#desc" required style="border-color: rgb(148, 148, 161);">
            <p class="form-text mb-3" id="desc">We'll not share ur email with anyone</p>

            <label for="mobileno" class="form-label">Mobile No:</label>
            <input type="number" class="form-control mb-3" id="mobileno" required style="border-color: rgb(148, 148, 161);">

            <label for="gender" class="form-label">Gender:</label>
            <div class="form-check" name="gender">
                <input class="form-check-input" type="radio" name="radioDefault" id="male" style="border-color: rgb(148, 148, 161);">
                <label class="form-check-label" for="male">
                    Male
                </label>
            </div>
            <div class="form-check mb-4" name="gender">
                <input class="form-check-input" type="radio" name="radioDefault" id="female" style="border-color: rgb(148, 148, 161);">
                <label class="form-check-label" for="female">
                    Female
                </label>
            </div>

            <label for="branch" class="form-label">Branch:</label>
            <select class="form-control dropdown-toggle-icon mb-3" id="branch" required style="border-color: rgb(148, 148, 161);">
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>AIML</option>
            </select>

            <label for="dob" class="form-label">Date of Birth:</label>
            <input type="date" class="form-control mb-3" id="dob" required style="border-color: rgb(148, 148, 161);">

            <label for="address" class="form-label">Address:</label>
            <input type="text" class="form-control mb-3" id="address" required style="border-color: rgb(148, 148, 161);">

            <label for="photo" class="form-label">Upload Photo:</label>
            <input type="file" class="form-control mb-3" id="photo" required style="border-color: rgb(148, 148, 161);">

            <input type="checkbox" class="form-check-input" id="checkbox" required style="border-color: rgb(148, 148, 161);">
            <label for="checkbox" class="form-check-label mb-4">Accept Terms and Conditions</label>

            <input type="submit" class="form-control" href="login.html" id="submit" style="border-color: rgb(148, 148, 161);">

        </form>
    </div>

    <footer class="bd-footer py-2 py-md-5 mt-5 bg-body-tertiary" style="background: linear-gradient(to top,lightblue,white);">
        <div class="container text-body-secondary">

                    </a>

                        <li class="mb-2">

                                rel="license noopener">CC BY 3.0</a>.
                        </li>
                        <li class="mb-2">Currently v5.3.8.</li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
