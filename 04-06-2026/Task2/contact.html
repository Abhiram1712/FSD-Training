<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <h2 class="text-center mb-4">Contact Us</h2>

        <div class="row">

            <div class="col-md-6">

                <form>

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Message</label>
                        <textarea class="form-control"></textarea>
                    </div>

                    <button class="btn btn-primary">
                        Send Message
                    </button>

                </form>

            </div>

            <div class="col-md-6">

                <div class="card">
                    <div class="card-body text-center">
                        <h4>Google Map Placeholder</h4>
                        <p>Map Location Here</p>
                    </div>
                </div>

                <div class="mt-3">
                    <h5>Address</h5>
                    <p>ABC Training Institute, Hyderabad</p>

                    <p>Phone: 9876543210</p>

                    <p>Email: info@abcinstitute.com</p>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
