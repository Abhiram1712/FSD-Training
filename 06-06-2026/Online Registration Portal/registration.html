<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration Portal </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</head>

<body
    style="background: linear-gradient(to right,lightpink,lightblue);">
    <nav class="navbar navbar-expand-sm bg-body-secondary">
        <div class="container">
            <img src="/04-06-2026/cvr.webp" class="navbar-brand" style="width: 40px;">
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-0">
                    <li class="nav-item"><a class="nav-link active" href="home.html">Home</a></li>
                    <li class="nav-item dropdown">
                        <button type="button" class="nav-link active dropdown-toggle"
                            data-bs-toggle="dropdown">Courses</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">CSE</a></li>
                            <li><a class="dropdown-item" href="#">ECE</a></li>
                            <li><a class="dropdown-item" href="#">EEE</a></li>
                            <li><a class="dropdown-item" href="#">AIML</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link active" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container border shadow-lg border-2 my-5 p-3 rounded-4" style="width: 500px;">
        <form action="submit">
            <p class="h4 mb-4 mt-2 text-center">Registration Form</p>

            <label for="name" class="form-label">Student Name:</label>
            <input type="text" class="form-control mb-3" id="name" required style="border-color: rgb(148, 148, 161);">

            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control mb-3" id="email" required style="border-color: rgb(148, 148, 161);">

            <label for="mno" class="form-label">Mobile No:</label>
            <input type="text" class="form-control mb-3" id="mno" required style="border-color: rgb(148, 148, 161);">

            <label for="gender" class="form-label">Gender:</label>
            <div class="form-check" name="gender">
                <input class="form-check-input" type="radio" name="radioDefault" id="male" style="border-color: rgb(148, 148, 161);">
                <label class="form-check-label" for="male">
                    Male
                </label>
            </div>
            <div class="form-check mb-4" name="gender">
                <input class="form-check-input" type="radio" name="radioDefault" id="female" style="border-color: rgb(148, 148, 161);">
                <label class="form-check-label" for="female">
                    Female
                </label>
            </div>

            <label for="branch" class="form-label">Course:</label>
            <select class="form-select mb-3" id="branch" required style="border-color: rgb(148, 148, 161);">
                <option>Computer Science</option>
                <option>Electrical Engineering</option>
                <option>Electronics Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>Chemical Engineering</option>
            </select>

            <label for="qualification" class="form-label">Qualification</label>
            <input type="text" class="form-control mb-3" id="qualification" required style="border-color: rgb(148, 148, 161);">

            <label for="address" class="form-label">Address:</label>
            <input type="text" class="form-control mb-3" id="address" required style="border-color: rgb(148, 148, 161);">

            <label for="photo" class="form-label">Upload Resume:</label>
            <input type="file" class="form-control mb-3" id="photo" required style="border-color: rgb(148, 148, 161);">

            <input type="checkbox" class="form-check-input" id="checkbox" required style="border-color: rgb(148, 148, 161);">
            <label for="checkbox" class="form-check-label mb-4">Accept Terms and Conditions</label>

            <input type="submit" class="form-control" href="login.html" id="submit" style="border-color: rgb(148, 148, 161);">
            
        </form>
    </div>

    <footer class="border border-bottom-0 rounded-4 p-4 py-5 w-100">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div>
                <h3 class="h4 text-dark mb-1 text-center fw-bold">CVR College of Engineering</h3>
                <p class="small text-dark mb-0">Vastunagar, Mangalpalli (V), Ibrahimpatnam, Telangana</p>
            </div>

            <div class="text-md-end">
                <p class="small text-dark mb-0">&copy; 2026 CVRCE. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>

</html>
