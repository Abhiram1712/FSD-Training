<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-Transition</title>
    <style>
        div{
            width:200px;
            height:200px;
            padding:10px;
            border:1px solid black;
            box-sizing: border-box;
            margin: 50%;
            text-align: center;
            transition-property: width height;
            transition-duration: 1s;
            transition-timing-function: ease;
        }
        p{
            font-weight: bold;
        }
        div:hover{
            width: 250px;
            height: 250px;
        }
    </style>
</head>
<body>
    <div class="card">
        <p>Name:Akhil</p>
        <p>Age:20</p>
        <p>Branch:CSE</p>
    </div>
</body>
</html>
