<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System HomePage</title>
    <style>
        *{
            font-family:'Arial','Times New Roman', Times, serif;
        }
        img{
            width: 50px;
        }
        header{
            margin: 20px;
        }
        .menu{
            background: linear-gradient(to right,lightblue,white);
            display: flex;
            padding: 10px;
        }
        ul{
            list-style: none;
        }
        li{
            display: inline;
            padding: 20px;
        }
        a{
            font-weight: bold;
            font-size: medium;
            text-decoration: none;
        }
        .main{
            display: flex;
            /* padding: 10px; */
        }
        section{
            padding: 10px;
            margin: 5px;
        }
        .features{
            background: linear-gradient(to top,lightblue,white);
            border: 1px solid black;
            border-radius: 10%;
        }
        .menuhead{
            font-size: large;
            text-align: center;
        }
        .ff{
            display: flex;
            flex-direction: column;
        }

        .hero{
            border: 1px solid black;
            border-radius: 10%;
        }
    </style>
</head>
<body>
    <header>
        <nav class="menu">
            <img src="/std.webp" alt="clglogo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Details</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <section class="features">
            <h1 class="menuhead">Menu</h1>
            <nav class="ff">
                <li><a href="#">Student Registration</a></li>
                <li><a href="#">Attendance</a></li>
                <li><a href="#">Resuls</a></li>
            </nav>
        </section>
        <section class="hero">
            <h1>Welcome to our Website</h1>
            <p></p>
        </section>
    </div>
    
</body>
</html>
