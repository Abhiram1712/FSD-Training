<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        .card{
            border:1px solid black;
            width: 300px;
            margin: 100px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: lavender;
        }
        .image{
            width: 100%;
            height: 300px;
            margin: 10px;
            background-image: url(/02-06-2026/assets/4.jpg);
            background-size: cover;
            border: 1px solid black;
        }
        .details{
            width: 100%;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            border:1px solid black;
        }
        button{
            margin-bottom: 10px;

        }
        
    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <p></p>
        </div>
        <div class="details">
            <p>Name: Flower</p>
            <p>Price: 100 Rs</p>
            <button>Buy Now</button>
        </div>
    </div>
    
</body>
</html>
