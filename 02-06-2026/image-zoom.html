<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Zoom Effect</title>
    <style>
        img{
            transition: transform 1s ease;
        }
        img:hover{
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <img src="/02-06-2026/std.webp">
</body>
</html>
