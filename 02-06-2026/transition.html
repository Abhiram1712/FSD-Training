<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        button{
            margin: 50% 50%;
            width: 100px;
            height: 60px;
            background-color: lightblue;
            font-weight: bold;
        }
        button:hover{
            background-color: green;
            transform: scale(1.1);
            transition: all 0.5s;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    
</body>
</html>
