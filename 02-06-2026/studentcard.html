<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Card</title>
    <style>
        .card{
            width: 300px;
            height: 200px;
            display: flex;
            padding: 10px;
            justify-content: center;
            align-items: center;
            margin: 50% auto;
            border:2px solid black;
            box-sizing: border-box;
        }
        .image{
            border:1px solid black;
            /* height: 100%; */
            /* width: 50%; */
            margin:auto;
            height : 120px;
        }
        .details{
            width: 100%;
            padding:20px;
            font-weight: bold;
        }
        @media screen and (max-width:768px) {
            .card{
                flex-direction: column;
            }
            .card{
                height: 300px;
            }
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <img src="unk.webp" alt="img" height="120px">
        </div>
        <div class="details">
            <p>Name:Akhil</p>
            <p>Branch:CSE</p>
            <p>Email:Student</p>
        </div>
    </div>
    
</body>
</html>
