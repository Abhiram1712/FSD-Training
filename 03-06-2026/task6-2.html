<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="card m-3 border-black rounded-4 justify-content-between align-items-center" style="width: 300px; height: 500px;">
        <div class="card-header">
            CVR COLLEGE OF ENGINEERING
        </div>
        <img class="card-img-top" src="../02-06-2026/assets/2.jpg" alt="image" style="height: 50%;">
        <div class="card-body">
            <div class="card-title fw-bold">Student Details</div>
            <div class="card-text m-2">Name: Akhil</div>
            <div class="card-text m-2">Roll No: 001</div>
            <div class="card-text m-2">Course: CSE</div>
        </div>
        <div class="card-footer">
            <button type="button" class="btn btn-primary">Submit</button>
        </div>

    </div>
    
</body>
</html>
