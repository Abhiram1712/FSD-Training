<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="btn-group">
        <button type="button" class="btn btn-primary p-3 m-3">Primary</button>
        <button type="button" class="btn btn-secondary p-3 m-3">Secondary</button>
        <button type="button" class="btn btn-warning p-3 m-3">Warning</button>
        <button type="button" class="btn btn-success p-3 m-3">Success</button>
        <button type="button" class="btn btn-danger p-3 m-3">Danger</button>
        <button type="button" class="btn btn-info p-3 m-3">Info</button>
        <button type="button" class="btn btn-link p-3 m-3">Link</button>
        <button type="button" class="btn btn-light p-3 m-3">Light</button>
        <button type="button" class="btn btn-dark p-3 m-3">Dark</button>
        <button type="button" class="btn btn-outline-danger p-3 m-3">Outline Danger</button>
        <button type="button" class="btn btn-outline-info p-3 m-3">Outline Info</button>
        <button type="button" class="btn btn-primary rounded-3 p-3 m-3">Button Rounded</button>
        <button type="button" class="btn btn-info rounded-pill p-3 m-3" style="width:140px">Button Pill</button>
    </div>
</body>

</html>
