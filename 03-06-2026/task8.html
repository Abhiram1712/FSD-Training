<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="d-flex justify-content-center">
        <form action="#" class="m-3 p-3 border-1 rounded-4" style="width: 300px; border:1px solid black;">
            <p class="h5 mb-4 text-center">Registration Form</p>
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control border-primary" id="email" required aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text mb-3">We'll never share ur email with anyone</div>

            <label for="password" class="form-label mt-3">Password</label>
            <input type="password" class="form-control border-primary mb-3" id="password" required>

            <input type="checkbox" class="form-check-input border-black" id="check" required>
            <label for="check" class="form-label mb-3">Accept Terms and Conditions</label>

            <button type="submit" class="btn d-block btn-primary w-100">Submit</button>
            <div class="card-text"></div>
        </form>
    </div>

</body>

</html>
