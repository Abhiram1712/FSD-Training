<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div>
        <p class="display-1">Welcome to BootStrap</p>
        <p class="lead">This is Lead Text</p>
        <p>This is Normal Text</p>
        <p class="fw-bold">This is Bold Text</p>
        <p class="text-muted">Hello</p>
        <p class="text-uppercase">this is originally typed in lowercase</p>
        <p class="text-lowercase">THIS IS ORIGINALLY TYPED IN UPPERCASE</p>
        <P class="text-capitalize">capitalized Text</P>
        <p class="text-success bg-dark">Success</p>
    </div>
</body>
</html>
