<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Column Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-3">
        <div class="row justify-content-center align-items-center vh-100">
           <div class="col-3 p-3 bg-primary text-center">Column-1</div>
           <div class="col-3 p-3 bg-secondary text-center">Column-2</div>
           <div class="col-3 p-3 bg-info text-center">Column-3</div>
           <div class="col-3 p-3 bg-warning text-center">Column-4</div>
        </div>
    </div>
</body>
</html>
